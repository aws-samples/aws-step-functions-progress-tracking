version: 2
updates:
  - package-ecosystem: npm
    directory: /progress-tracker-frontend
    schedule:
      interval: weekly
    groups:
      # One PR for all security fixes, so related advisories (for example
      # next plus its pinned postcss) land together and CI's npm audit passes.
      frontend-security:
        applies-to: security-updates
        patterns: [ "*" ]
      frontend-minor-and-patch:
        applies-to: version-updates
        patterns: [ "*" ]
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: [ "*" ]
